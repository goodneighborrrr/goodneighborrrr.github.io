<style>
/* 跟單字 App 用同一套顏色跟字體，看起來像同一個家族 */
:root{
  --leaf:#39a947; --leaf-ink:#1f6e2b; --leaf-wash:#e7f4e8;
  --paper:#f5f7f3; --card:#ffffff; --ink:#16201a; --muted:#5d6a60; --line:#dbe3da;
  --wrong:#c8473b; --wrong-wash:#fbeae7; --shade:rgba(22,32,26,.42);
  --font-ui:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-en:"Literata",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --leaf:#57c265;--leaf-ink:#8ad795;--leaf-wash:#1b2d1e;--paper:#0f1411;--card:#171e19;--ink:#e6ece7;--muted:#97a49a;--line:#2a352d;--wrong:#ec7a6e;--wrong-wash:#3a1f1c;--shade:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.barrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.back{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.back:hover{color:var(--ink)}
h1{font-size:17px;margin:0}
main{padding-block:20px 56px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 200px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
.primary{width:100%;height:50px;border-radius:25px;border:0;background:var(--leaf);color:#fff;font-weight:700;font-size:16px;letter-spacing:.04em}
.primary:disabled{opacity:.5;cursor:default}
.primary:hover:not(:disabled){filter:brightness(1.05)}
.ghost{height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.ghost:hover{border-color:var(--leaf)}
.ghost.on{background:var(--leaf-wash);border-color:var(--leaf);color:var(--leaf-ink)}
.danger{border-color:var(--wrong);color:var(--wrong)}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.note.err{color:var(--wrong);border-color:var(--wrong);background:var(--wrong-wash)}
.mic{display:grid;place-items:center;gap:10px;padding:18px 0}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--leaf);color:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.micbtn svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.micbtn.listening{background:var(--wrong);animation:pulse 1.1s infinite ease-in-out}
.micbtn.busy{background:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(200,71,59,.18)}}
.micstate{font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.live{font-family:var(--font-en);font-size:17px;line-height:1.6;min-height:3.2em;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1.5px dashed var(--line);color:var(--ink)}
.live .interim{color:var(--muted)}
.live.empty{color:var(--muted)}
.turnctrls{display:flex;gap:10px;justify-content:center}
.log{display:grid;gap:14px;margin-top:22px}
.turn{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;display:grid;gap:10px}
.turn .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.turn .you{font-family:var(--font-en);font-size:15px;color:var(--muted)}
.turn .fixblock{background:var(--leaf-wash);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.turn .fixen{font-family:var(--font-en);font-size:16px;font-weight:600;color:var(--ink)}
.turn .fixzh{font-size:13.5px;color:var(--leaf-ink);line-height:1.6}
.turn .reply{display:flex;align-items:flex-start;gap:10px}
.turn .replytext{font-family:var(--font-en);font-size:16px;flex:1}
.turn .playbtn{border:0;background:none;color:var(--muted);flex:none;padding:2px}
.turn .playbtn:hover{color:var(--leaf-ink)}
.empty{text-align:center;padding:40px 8px;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:blink 1s infinite ease-in-out}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap barrow">
    <a class="back" href="../index.html">← 回單字 App</a>
    <h1>英語口說練習</h1>
    <span style="width:72px"></span>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite">
  <p class="empty loading"><span class="dot"></span>載入中…</p>
</main>

<script type="module">
/* ============================================================
   英語口說練習 — 用瀏覽器內建的語音功能（免費），
   講完一輪之後請 Gemini 幫忙「糾正」跟「回話」。

   跟單字 App 用同一個 Firebase 專案、同一組帳號登入。
   AI 的通行碼（Gemini API Key）也是同一個：
   在單字 App 的「單字庫 → 設定」貼過的那組，這裡直接拿來用，
   不會另外存一份，也不會寫進程式碼或 git。
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIkFjY6b4y35bB1darIHl2qq9VpHXJUEs",
  authDomain: "eq-vocab-app.firebaseapp.com",
  projectId: "eq-vocab-app",
  storageBucket: "eq-vocab-app.firebasestorage.app",
  messagingSenderId: "927137297068",
  appId: "1:927137297068:web:5c37615ddf1ebd825da509",
};
const OWNER_EMAIL = "shihchun7644@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const $ = s => document.querySelector(s);
const main = $("#main");
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- 登入（跟單字 App 共用同一個帳號） ---------- */
function authMessage(code){
  return ({
    "auth/wrong-password": "密碼不對，請再試一次。",
    "auth/invalid-credential": "帳號或密碼不對，請再試一次。",
    "auth/user-not-found": "找不到這個帳號，請先去單字 App 建立密碼。",
    "auth/invalid-email": "信箱格式不對。",
    "auth/too-many-requests": "嘗試太多次了，請過幾分鐘再試。",
    "auth/network-request-failed": "沒有網路，請確認網路連線。",
  })[code] || "登入時發生問題，請再試一次。";
}
function renderLogin(note = ""){
  main.innerHTML = `
    <div class="empty" style="padding-bottom:12px"><h2 style="color:var(--ink)">先登入</h2><p>跟單字 App 用同一個帳號</p></div>
    <form class="stack" id="loginForm" autocomplete="on" style="max-width:420px;margin:0 auto">
      <label class="f" for="lgEmail">信箱<input type="email" id="lgEmail" autocomplete="username" autocapitalize="off" spellcheck="false" value="${OWNER_EMAIL}"></label>
      <label class="f" for="lgPass">密碼<input type="password" id="lgPass" autocomplete="current-password" required></label>
      <div id="lgMsg">${note ? `<p class="note">${escapeHtml(note)}</p>` : ""}</div>
      <button class="primary" type="submit" id="lgGo">登入</button>
    </form>`;
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("#lgGo").disabled = true;
    try { await signInWithEmailAndPassword(auth, $("#lgEmail").value.trim(), $("#lgPass").value); }
    catch (err){ $("#lgMsg").innerHTML = `<p class="note err">${escapeHtml(authMessage(err.code))}</p>`; $("#lgGo").disabled = false; }
  });
}

/* ---------- Gemini（跟單字 App 用同一組「AI 通行碼」，使用者自己貼的，不是寫在程式碼裡） ---------- */
const AI = {
  models: ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest", "gemini-2.5-flash-lite"],
  async call(prompt, key){
    // 這是在練口說對話，等待感要越短越好——所以不像單字 App 那樣一個一個「輪流試、等了才換下一個」，
    // 而是「4 個版本同時問」，誰先回來就先用誰，其他的結果就不管了。
    // 這樣最慢也只要等「最快那個」的時間，而不是把 4 個的等待時間疊加起來。
    // 每一個版本都設一個「最多等 12 秒」的上限：如果 Google 那邊完全沒回應（不是回錯誤，是整個卡住不動），
    // 12 秒一到就直接當作這個版本失敗，不會讓畫面一直停在「AI 想一下…」卻永遠等不到結果。
    const TIMEOUT_MS = 12000;
    const attempts = this.models.map(model => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.7 } }),
        signal: ctrl.signal,
      }).then(res => ({ res, timedOut: false })).catch(err => ({ res: null, timedOut: err.name === "AbortError" })).finally(() => clearTimeout(timer));
    });
    const results = await Promise.all(attempts);
    const good = results.find(r => r.res && r.res.ok);
    const res = good ? good.res : null;
    const statuses = results.map(r => (r.res ? r.res.status : 0));
    const allTimedOut = results.every(r => r.timedOut);
    const lastStatus = statuses.find(s => [400, 401, 403].includes(s)) || statuses.find(s => s === 429) || statuses[0] || 0;
    if (!res){
      const e = new Error("http " + lastStatus); e.status = lastStatus;
      e.userMessage = allTimedOut ? "Google 的 AI 伺服器完全沒回應（等超過 12 秒），請檢查網路後再試一次。"
        : lastStatus === 429 ? "今天的 AI 免費額度用完了，等明天再試試看。"
        : (lastStatus === 400 || lastStatus === 401 || lastStatus === 403) ? "AI 通行碼好像不對，請到單字 App 的「單字庫 → 設定」重新貼一次。"
        : (lastStatus === 503 || lastStatus === 500) ? "Google 的 AI 現在太多人在用，過幾分鐘再試一次。"
        : "AI 暫時沒辦法使用，請稍後再試。";
      throw e;
    }
    const j = await res.json();
    const text = j?.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
    try { return JSON.parse(text); } catch { return {}; }
  },
};

function buildPrompt(history, said){
  const ctx = history.slice(-6).map(h => `你：${h.said}\nAI：${h.reply}`).join("\n");
  return `你是一位親切、有耐心的英語口說教練，陪一位台灣的英語學習者（中文使用者，英語中等程度）練習日常口說對話。
以下是這段對話最近的內容（可能是空的）：
${ctx || "（這是第一輪，還沒有之前的對話）"}

學習者剛剛用語音說了這句話（已經由語音辨識轉成文字，可能有辨識錯誤或不太通順）：
"""${said}"""

請用繁體中文和英文回覆，回傳「只有一個 JSON 物件」，格式如下，不要加其他文字：
{
  "corrected": "把學習者那句話改成自然、正確的英文（如果本來就沒問題，就照原句或只是稍微潤飾）",
  "explanation_zh": "用簡單、口語、不要術語的台灣繁體中文，1到3句話說明改了什麼、為什麼改（文法、用字、說法自然度）。如果本來就很好，就稱讚一下，不用硬找問題。",
  "reply": "像朋友聊天一樣，用簡單自然的英文接著聊下去（不要太長，1到3句），可以順便問個問題延續話題"
}`;
}

/* ---------- 語音辨識（Web Speech API，瀏覽器內建、免費） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const FINISH_RE = /(?:that'?s it|that is it)[.!]?\s*$/i;

function renderApp(aiKey){
  main.innerHTML = `
    <div class="stack">
      ${!SR ? `<p class="note err">這個瀏覽器不支援語音辨識功能。iPhone 請用 Safari，電腦請用 Chrome 或 Edge。</p>` : ""}
      ${!aiKey ? `<p class="note err">還沒有設定 AI 通行碼。請先到<a href="../index.html">單字 App</a> → 單字庫 → 最下面的設定，貼上 Google AI 通行碼。</p>` : ""}
      <div class="mic">
        <button class="micbtn" id="micBtn" aria-label="開始對話" ${!SR || !aiKey ? "disabled" : ""}>
          <svg viewBox="0 0 24 24" id="micIcon"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>
        </button>
        <div class="micstate" id="micState">按一下開始，用英文自由說話</div>
      </div>
      <div class="live empty" id="live" hidden>還沒說話…</div>
      <div class="turnctrls" id="turnCtrls" hidden>
        <button class="ghost" id="finishBtn">這輪說完了</button>
      </div>
      <div class="row" style="justify-content:center">
        <button class="ghost ${localStorage.getItem("sp_autospeak") !== "0" ? "on" : ""}" id="autospeak">AI 回覆自動唸出來</button>
        <button class="ghost danger" id="endSession" hidden>結束對話</button>
      </div>
      <p class="note">小提醒：自由地用英文說話就好，想結束這一輪時說「that's it」，或直接按「這輪說完了」。</p>
      <div class="log" id="log"></div>
    </div>`;

  const micBtn = $("#micBtn"), micState = $("#micState"), live = $("#live"), turnCtrls = $("#turnCtrls"),
        endBtn = $("#endSession"), log = $("#log"), autospeakBtn = $("#autospeak");

  autospeakBtn.onclick = () => {
    const now = localStorage.getItem("sp_autospeak") !== "0";
    try { localStorage.setItem("sp_autospeak", now ? "0" : "1"); } catch {}
    autospeakBtn.classList.toggle("on", !now);
  };
  const autospeakOn = () => { try { return localStorage.getItem("sp_autospeak") !== "0"; } catch { return true; } };

  if (!SR || !aiKey) return;

  let rec = null, sessionOn = false, turnBuffer = "", liveInterim = "", finishedByPhrase = false, busy = false;
  const history = [];

  function newRecognizer(){
    const r = new SR();
    r.lang = "en-US"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++){
        const text = e.results[i][0].transcript;
        if (e.results[i].isFinal) turnBuffer = (turnBuffer + " " + text).trim();
        else interim += text;
      }
      liveInterim = interim;
      showLive(interim);
      // Safari 常常遲遲不把結果標記成「確定」（isFinal），有時候整段話從頭到尾都只停在
      // 「暫時顯示」（interim）。所以同時也檢查「turnBuffer + 還沒確定的 interim」合在一起
      // 有沒有講出「that's it」，不要只檢查已確定的 turnBuffer，不然會偵測不到。
      if (!finishedByPhrase && FINISH_RE.test((turnBuffer + " " + interim).trim())){
        finishedByPhrase = true; endTurn();
      }
    };
    r.onerror = e => {
      if (e.error === "no-speech" || e.error === "aborted") return; // 常見狀況，交給 onend 自動重開
      if (e.error === "not-allowed" || e.error === "service-not-allowed"){
        toast("沒有麥克風權限，請到瀏覽器設定允許使用麥克風"); stopSession(); return;
      }
      // 其他錯誤（常見於網路不穩）：讓 onend 處理重開
    };
    r.onend = () => {
      // iPhone 的 Safari 常常自己把辨識停掉（即使設了 continuous），
      // 只要對話還在進行、這一輪還沒結束，就自動接著重開，讓使用者感覺像是「一直在聽」。
      if (sessionOn && !busy && micBtn.classList.contains("listening")){
        try { rec.start(); } catch { setTimeout(() => { try { rec.start(); } catch {} }, 300); }
      }
    };
    return r;
  }

  function showLive(interim){
    live.hidden = false;
    const text = turnBuffer + (interim ? (turnBuffer ? " " : "") + interim : "");
    live.classList.toggle("empty", !text);
    live.innerHTML = text ? `${escapeHtml(turnBuffer)}${interim ? ` <span class="interim">${escapeHtml(interim)}</span>` : ""}` : "還沒說話…";
  }

  function startTurn(){
    turnBuffer = ""; liveInterim = ""; finishedByPhrase = false;
    live.hidden = false; live.classList.add("empty"); live.textContent = "還沒說話…";
    turnCtrls.hidden = false;
    micBtn.classList.add("listening"); micBtn.classList.remove("busy");
    micState.textContent = "聽你說話中…說完請說「that's it」";
    rec = newRecognizer();
    try { rec.start(); } catch {}
  }

  function stopRecognizer(){
    micBtn.classList.remove("listening");
    if (rec){ try { rec.onend = null; rec.stop(); } catch {} }
  }

  async function endTurn(){
    // 用「已確定的文字」加上「還沒確定、但畫面上已經看得到的文字」合起來當作這輪說的話——
    // 不要只靠已確定的 turnBuffer，因為 Safari 常常遲遲不把話標記成「確定」，
    // 尤其是手動按「這輪說完了」的當下，那句話很可能永遠停在「暫時顯示」階段。
    const said = (turnBuffer + " " + liveInterim).replace(FINISH_RE, "").trim();
    stopRecognizer();
    turnCtrls.hidden = true;
    if (!said){ if (sessionOn) startTurn(); return; }
    busy = true; micBtn.classList.add("busy"); micState.textContent = "AI 想一下…";
    live.hidden = true;
    const row = document.createElement("div"); row.className = "turn";
    row.innerHTML = `<div class="lbl">你說的</div><div class="you">${escapeHtml(said)}</div><div class="note loading"><span class="dot"></span>AI 正在看…</div>`;
    log.prepend(row);
    try {
      const data = await AI.call(buildPrompt(history, said), aiKey);
      const corrected = String(data.corrected || said);
      const explanation = String(data.explanation_zh || "");
      const reply = String(data.reply || "");
      history.push({ said, reply });
      row.innerHTML = `
        <div class="lbl">你說的</div><div class="you">${escapeHtml(said)}</div>
        <div class="fixblock"><div class="fixen">${escapeHtml(corrected)}</div>${explanation ? `<div class="fixzh">${escapeHtml(explanation)}</div>` : ""}</div>
        <div class="lbl">AI 接著說</div>
        <div class="reply"><div class="replytext">${escapeHtml(reply)}</div><button class="playbtn" aria-label="播放" data-say="${escapeHtml(reply)}">🔊</button></div>`;
      row.querySelector(".playbtn").onclick = () => speak(reply);
      if (autospeakOn() && reply) await speak(reply);
    } catch (err){
      row.innerHTML = `<div class="lbl">你說的</div><div class="you">${escapeHtml(said)}</div><p class="note err">${escapeHtml(err.userMessage || "AI 暫時沒辦法使用。")}</p>`;
    }
    busy = false; micBtn.classList.remove("busy");
    if (sessionOn) startTurn();
  }

  function speak(text){
    return new Promise(resolve => {
      try {
        if (!("speechSynthesis" in window)) return resolve();
        // 唸之前先把麥克風關掉，避免手機把 AI 的聲音又聽成使用者在說話
        stopRecognizer();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.onend = () => resolve(); u.onerror = () => resolve();
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch { resolve(); }
    });
  }

  function startSession(){
    sessionOn = true; endBtn.hidden = false; micBtn.setAttribute("aria-label", "進行中");
    startTurn();
  }
  function stopSession(){
    sessionOn = false; busy = false;
    stopRecognizer();
    try { speechSynthesis.cancel(); } catch {}
    micBtn.classList.remove("busy", "listening");
    turnCtrls.hidden = true; live.hidden = true; endBtn.hidden = true;
    micState.textContent = "按一下開始，用英文自由說話";
  }

  micBtn.onclick = () => { if (!sessionOn) startSession(); };
  $("#finishBtn").onclick = () => { if (sessionOn && !busy) endTurn(); };
  endBtn.onclick = stopSession;
}

onAuthStateChanged(auth, async user => {
  if (!user){ renderLogin(); return; }
  main.innerHTML = `<p class="empty loading"><span class="dot"></span>載入中…</p>`;
  let aiKey = "";
  try { const snap = await getDoc(doc(db, "users", user.uid)); aiKey = snap.exists() ? (snap.data().aiKey || "") : ""; }
  catch {}
  renderApp(aiKey);
});
</script>
